name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test deps
        run: npm install
        working-directory: tests
      - name: Syntax gate
        run: node --check app.js && node --check background.js
      - name: Run suites
        run: npm test
        working-directory: tests
